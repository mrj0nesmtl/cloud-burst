<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>You're Offline | Cloudburst</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#2563eb">
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --background: #ffffff;
      --text: #0f172a;
      --error: #ef4444;
      --border: #e2e8f0;
    }
    
    @media (prefers-color-scheme: dark) {
      :root {
        --background: #0f172a;
        --text: #f8fafc;
        --border: #334155;
      }
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      background-color: var(--background);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      text-align: center;
    }
    
    .container {
      max-width: 600px;
      width: 100%;
      padding: 2rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
    }
    
    .logo {
      width: 80px;
      height: 80px;
    }
    
    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }
    
    p {
      font-size: 1rem;
      line-height: 1.5;
      margin-bottom: 1rem;
      color: var(--text);
      opacity: 0.9;
    }
    
    .button {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 0.375rem;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      font-size: 1rem;
      transition: background-color 0.2s;
      display: inline-block;
      margin-top: 1rem;
    }
    
    .button:hover {
      background-color: var(--primary-dark);
    }
    
    .status-indicator {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 1.5rem;
      font-size: 0.875rem;
      color: var(--error);
    }
    
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--error);
    }
    
    footer {
      margin-top: 2rem;
      font-size: 0.75rem;
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="/logo-192.png" alt="Cloudburst Logo" class="logo" />
    
    <div class="content">
      <h1>You're currently offline</h1>
      <p>It looks like you've lost your internet connection. Cloudburst requires an internet connection to access your events and photos.</p>
      <p>Some features may be available offline if you've visited them before.</p>
      
      <button onclick="attemptReconnect()" class="button">Try Again</button>
      
      <div class="status-indicator">
        <span class="status-dot"></span>
        <span>No internet connection</span>
      </div>
    </div>
  </div>
  
  <footer>
    &copy; Cloudburst Event Media + Invitation Platform
  </footer>
  
  <script>
    // Check for online status periodically
    function checkOnlineStatus() {
      if (navigator.onLine) {
        window.location.href = '/';
      }
    }
    
    // Attempt to reconnect
    function attemptReconnect() {
      if (navigator.onLine) {
        window.location.href = '/';
      } else {
        alert('Still offline. Please check your internet connection.');
      }
    }
    
    // Listen for online event
    window.addEventListener('online', function() {
      window.location.href = '/';
    });
    
    // Check every 5 seconds
    setInterval(checkOnlineStatus, 5000);
  </script>
</body>
</html>
